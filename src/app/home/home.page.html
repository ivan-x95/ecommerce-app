<ion-header>
  <ion-toolbar color="primary">
    <ion-title>QuickShop</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/products">Products</ion-button>
      <ion-button routerLink="/cart">Cart</ion-button>
      <ion-button routerLink="/profile">Profile</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>Welcome to QuickShop!</h1>
  <p>Your one-stop online store for gadgets, bags, shoes, and everyday essentials at friendly prices.</p>

<h2>Featured Products</h2>
<div class="product-grid">
  @for (p of featured; track p.id) {
    <ion-card [routerLink]="['/product-details', p.id]">
      <img [src]="p.image" [alt]="p.name" />
      <ion-card-header>
        <ion-card-title>{{ p.name }}</ion-card-title>
        <ion-card-subtitle>₱{{ p.price }}</ion-card-subtitle>
      </ion-card-header>
    </ion-card>
  }
</div>

  <ion-button expand="block" routerLink="/products">Shop All Products</ion-button>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>My Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>{{ customer.name }}</ion-card-title>
      <ion-card-subtitle>Member since {{ customer.memberSince }}</ion-card-subtitle>
    </ion-card-header>
  </ion-card>

  <ion-list>
    <ion-item><ion-label><p>Email</p><h3>{{ customer.email }}</h3></ion-label></ion-item>
    <ion-item><ion-label><p>Contact Number</p><h3>{{ customer.phone }}</h3></ion-label></ion-item>
    <ion-item><ion-label><p>Address</p><h3>{{ customer.address }}</h3></ion-label></ion-item>
  </ion-list>

  <ion-button expand="block" routerLink="/home">Back to Home</ion-button>
</ion-content>
